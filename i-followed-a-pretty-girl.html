<script>
    // update faux-retro year range but keep the 1997 joke

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const trigger = document.getElementById('2oc-audio-trigger');
        const audio   = document.getElementById('2oc');

        if (!trigger || !audio) return;

        trigger.addEventListener('click', function () {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const trigger = document.getElementById('twhf-audio-trigger');
        const audio   = document.getElementById('twhf');

        if (!trigger || !audio) return;

        trigger.addEventListener('click', function () {
            if (audio.paused) {

            } else {

            }
        });
    });
</script>
